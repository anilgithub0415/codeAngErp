<div class="tabs-container">
  
  <!-- 1. Top row containing the buttons -->
  <div class="flex justify-content-center mb-0">
    <p-selectButton
      [options]="options"
      [ngModel]="internalActiveTab"
      (ngModelChange)="onUiTabChange($event)"
      optionLabel="label"
      optionValue="id"
      [allowEmpty]="false"
      class="compact-tabs-group">
    </p-selectButton>
  </div>

  <!-- 2. Bottom portion where content lazy-loads dynamically -->
  <div class="p-0 border-1 surface-border border-round bg-card mt-0">
    <!-- 🚀 Bound to internalActiveTab so template compilation updates instantly -->
    <div *ngFor="let tab of tabTemplates">
      <ng-container *ngIf="tab.tabId === internalActiveTab">
        <ng-container *ngTemplateOutlet="tab.templateRef"></ng-container>
      </ng-container>
    </div>
  </div>
</div>
