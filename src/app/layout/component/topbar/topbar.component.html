<header class="topbar">
  <div class="logo">App Console</div>

  <!-- This section only displays if the user is verified as a SuperAdmin -->
  <div *ngIf="isSuperAdminProfile" class="pretend-selector-wrapper">
    <span class="mode-indicator">
      {{ currentTenantId === 0 ? '👑 Global Active Mode' : '👀 Pretending Mode' }}
    </span>

    <select [value]="currentTenantId" (change)="onSelectPretendTenant($event)" class="context-dropdown">
      <ng-container *ngFor="let ctx of contexts">
        <option [value]="ctx.tenantId">
          {{ ctx.tenantId === 0 ? 'Global System (All Tenants)' : 'Pretend as: ' + ctx.tenantName }}
        </option>
      </ng-container>
    </select>
  </div>

  <div class="user-profile">
    <span>Profile Active</span>
  </div>
</header>
