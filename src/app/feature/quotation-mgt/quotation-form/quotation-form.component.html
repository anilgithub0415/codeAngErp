<form [formGroup]="form" class="order-form"> 
  
  
    <!-- INTERACTIVE FORM MATRIX ENGINE CONTAINER -->
  <div class="order-header mb-4">
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-xl font-bold">Customer Quotation Specification</h2>
      <div class="grand-total-badge p-2 bg-slate-100 rounded border font-semibold text-lg">
        Estimated Grand Total: ₹{{ model?.totalAmount || 0 | number:'1.2-2' }}
      </div>
    </div>
    <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>
  </div>

  <!-- PIPELINE PROCESSING ACTIONS PANEL -->
  <div class="order-actions mb-4">
    <!-- 1. Original Save Button for Internal Wholesaler Team -->
    <p-button
      *ngIf="opMode !== FormOpMode.PortalNegotiation"
      type="button"
      label="wholesaler only: Save Quotation Structure"
      icon="pi pi-save"
    
      (click)="saveQuotation()"
      [disabled]="!form.valid">
    </p-button>

    <!-- 2. NEW: Dedicated Client Counter-Offer Button visible inside ClientPortal -->
    <p-button
      *ngIf="opMode === FormOpMode.PortalNegotiation"
      type="button"
      label="clientOnly: Submit Counter-Offer / Target Price"
      icon="pi pi-comments"
      styleClass="p-button-warning"
      (click)="submitPortalCounterOffer()"
      [disabled]="!form.valid">
    </p-button>

<ng-container *ngxPermissionsOnly="['Quotation.SubmitToApprove']">
    <ng-container *ngIf="workflow?.actions?.canSubmitToApprove">
        <p-button
            type="button"
            label="Submit for Approval"
            icon="pi pi-send"
            styleClass="p-button-success"
            (click)="submitQuotationForApproval()">
        </p-button>
    </ng-container>
</ng-container>

    <div>
  STATUS: {{ model?.status }}
  <br>

  CAN canRevise:
  {{ workflow?.actions?.canRevise }}

  <br> 

  PERMISSION:
  Quotation.Send
</div>



<ng-container *ngxPermissionsOnly="['Quotation.Revise']">
    <ng-container *ngIf="workflow?.actions?.canRevise">
        <p-button
            type="button"
            label="Revise"
            icon="pi pi-send"
            styleClass="p-button-success"
            (click)="onReviseClicked()">
        </p-button>
    </ng-container>
</ng-container>

<ng-container *ngxPermissionsOnly="['Quotation.Approve']">
    <ng-container *ngIf="workflow?.actions?.canApprove">
        <p-button
            type="button"
            label="Approve Quotation"
            icon="pi pi-check"
            styleClass="p-button-success"
            (click)="onApproveClicked()">
        </p-button>
    </ng-container>
</ng-container>
<ng-container *ngxPermissionsOnly="['Quotation.Send']">
    <ng-container *ngIf="workflow?.actions?.canSend">
        <p-button
            type="button"
            label="Send Quotation"
            icon="pi pi-check"
            styleClass="p-button-success"
            (click)="onSendClicked()">
        </p-button>
    </ng-container>
</ng-container>

    <button
      pButton
      type="button"
      label="Clear Entry"
      icon="pi pi-refresh"
      (click)="clearForm()"
      class="p-button-secondary"
      style="margin-left: 0.5rem">
    </button>
    <button
      pButton
      type="button"
      label="Cancel"
      icon="pi pi-times"
      (click)="CancelFormOp()"
      class="p-button-secondary"
      style="margin-left: 0.5rem">
    </button>
  </div>
</form>
