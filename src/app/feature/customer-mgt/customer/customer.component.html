<p>customer works!</p> 

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <formly-form 
        [form]="form"
        [fields]="fields"
        [model]="model">

    
    </formly-form>
    <button type="submit" [disabled]="!form.valid">Save User</button>
</form>


<p-dataview *ngIf="customers?.length" [value]="customers" [layout]="'list'" [paginator]="true" [rows]="10">
  <ng-template #list let-items>
    <div class="flex flex-col gap-0 p-1">
      <div [style.maxHeight.px]="rowHeight" *ngFor="let customer of items" class="border rounded-lg p-2 flex items-start gap-4">
        
        <div class="flex items-start gap-4 w-full">
          <div  class="text-xl font-bold truncate">{{ customer.customerName }}</div>
          <div  class="text-xl font-bold truncate">{{ customer.customerCategory }}</div>

        </div>
      </div>
    </div>
  </ng-template>
</p-dataview>
