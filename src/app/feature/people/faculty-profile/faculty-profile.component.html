<p-toast></p-toast> <!-- PrimeNG Toast for messages -->

<p-toolbar styleClass="mb-4">
   
    <ng-template #start> 
        <p-button  label="New FacultyProfile" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" 
        *ngxPermissionsOnly="['facultyprofile.create',]"
                                                           
        />
        <!-- <p-button  severity="danger" label="Delete Selected" icon="pi pi-trash" outlined (onClick)="deleteSelectedUsers()"
            [disabled]="!selectedUsers || !selectedUsers.length" /> -->
    </ng-template>

    <ng-template #end>
        <p-button label="Export CSV" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>

<!-- PrimeNG Table for User Listing -->
<p-table #dt 
    [value]="(facultyprofiles$ | async) ?? []"
    [rows]="10"
    [columns]="cols"
    [paginator]="true"
    [globalFilterFields]="['person.firstName','employeeIdNumber','department']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selectedUsers"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} facultyprofiles"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 20, 30]"
>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">FacultyProfiles</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>

    <ng-template #header>
        <tr>
            <th pSortableColumn="id" style="min-width: 0.1rem">
                    
                <!-- <p-sortIcon field="id" /> -->
            </th>
            <th pSortableColumn="personId" style="min-width: 5rem">
                personId    
                <p-sortIcon field="personId" />
            </th>
           
            <th pSortableColumn="role" style="min-width: 5rem">
                employeeIdNumber
                <p-sortIcon field="employeeIdNumber" />
            </th>
           
            <th pSortableColumn="department" style="min-width: 5rem">
                department
                <p-sortIcon field="department" />
            </th>
         
        </tr>
    </ng-template>

    <ng-template #body let-facultyprofile>
        <tr>
          
            <!-- <td>{{facultyprofile.id}}</td> -->
            <td></td>
            <td>{{facultyprofile.person.firstName}}  {{facultyprofile.person.lastName}}</td>
            <td>{{facultyprofile.employeeIdNumber}}</td> 
            <td>{{facultyprofile.department}}</td>
           
           
           <td>
                 <span *ngIf="authService.getUserId()==facultyprofile.createdByUserId">.</span>
                   <p-button  icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"  (click)="editFacultyProfile(facultyprofile)" *ngIf="(facultyprofile.canEdit$|async)"></p-button>
                 <p-button  icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"  [disabled]="true"        *ngIf="!(facultyprofile.canEdit$|async)"></p-button>
              
                 <p-button  icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" *ngIf="(facultyprofile.canDelete$|async)" (click)="deleteFacultyProfile(facultyprofile)" />
                 <p-button  icon="pi pi-trash" class="mr-2" [rounded]="true" [outlined]="true"     *ngIf="!(facultyprofile.canDelete$|async)" [disabled]="true"></p-button>
            </td> <!--  -->
        </tr>
    </ng-template>
</p-table>
