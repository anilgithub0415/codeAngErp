<p-toast></p-toast> <!-- PrimeNG Toast for messages -->

<p-toolbar styleClass="mb-4">
   
    <ng-template #start> 
        <p-button  label="New Program" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" 
        *ngxPermissionsOnly="['program.create',]"
                                                           
        />
    </ng-template>

    <ng-template #end>
        <p-button label="Export CSV" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar> 

<!-- PrimeNG Table for User Listing -->
<p-table #dt 
    [value]="(programs$ | async) ?? []"
    [rows]="10"
    [columns]="cols"
    [paginator]="true"
    [globalFilterFields]="['programCode','programName']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selectedUsers"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} programs"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 20, 30]"
>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Programs</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>

    <ng-template #header>
        <tr>
            <th pSortableColumn="id" style="min-width: 0.1rem">
                    
                <!-- <p-sortIcon field="id" /> -->
            </th>
            <th pSortableColumn="programCode" style="min-width: 5rem">
                programCode    
                <p-sortIcon field="programCode" />
            </th>
           
            <th pSortableColumn="role" style="min-width: 5rem">
                programName
                <p-sortIcon field="programName" />
            </th>
           
            <th pSortableColumn="duration" style="min-width: 5rem">
                Duration
                <p-sortIcon field="duration" />
            </th>
            
            
            <th pSortableColumn="targetExam" style="min-width: 5rem">
                targetExam
                <p-sortIcon field="targetExam" />
            </th>
         
        </tr>
    </ng-template>

    <ng-template #body let-program>
        <tr>
          
            <!-- <td>{{program.id}}</td> -->
            <td></td>
            <td>{{program.programCode}}</td>
           <td>{{program.programName}}</td> 
            <td>{{program.durationMonths}}</td>            
           <td>{{program.targetExam}}</td> 
           
           
           
           <td>
                 <span *ngIf="authService.getUserId()==program.createdByUserId">.</span>
                   <p-button  icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"  (click)="editProgram(program)" *ngIf="(program.canEdit$|async)"></p-button>
                 <p-button  icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"  [disabled]="true"        *ngIf="!(program.canEdit$|async)"></p-button>
              
                 <p-button  icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" *ngIf="(program.canDelete$|async)" (click)="deleteProgram(program)" />
                 <p-button  icon="pi pi-trash" class="mr-2" [rounded]="true" [outlined]="true"     *ngIf="!(program.canDelete$|async)" [disabled]="true"></p-button>
            </td>  <!--  -->
        </tr>
    </ng-template>
</p-table>
