<p-toast></p-toast> <!-- PrimeNG Toast for messages -->

<p-toolbar styleClass="mb-4">
   
    <ng-template #start> 
        <p-button  label="New Assignment" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" 
        *ngxPermissionsOnly="['assignment.create',]"
                                                           
        />
    </ng-template>

    <ng-template #end>
        <p-button label="Export CSV" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>



<p-confirmDialog></p-confirmDialog> 


 <!-- Dialog for User Details (Create/Edit Form) --> <!--width: '450px' -->
 <p-dialog [(visible)]="assignmentDialog" [style]="{ width: '850px' }" [header]="dialogHeader" [modal]="true">

    <!--purposelynot kept inside ng-template-->
    <ng-template #content  ></ng-template>

      <form [formGroup]="form" (ngSubmit)="onSubmit()"><!--(ngSubmit)="saveUser()"-->
    <formly-form [form]="form" [fields]="(formFields | async) ?? []" [model]="model"></formly-form>
    <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
     <p-button type="submit">Submit</p-button>
     </form>  
                    
    <!-- <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Save" (click)="saveUser()"  icon="pi pi-check" /> 
    </ng-template> -->


</p-dialog>


<p-table #dt
    [value]="(assignments$ | async) ?? []"
    [rows]="10"
    [columns]="cols"
    [paginator]="true"
    [globalFilterFields]="['studentProfile.person.firstName', 'studentProfile.person.lastName', 'program.programName']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} assignmentments"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 20, 30]">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Assignmentment</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>

    <ng-template pTemplate="header" let-columns>
        <tr>
            <!-- <th style="max-width: 0.1rem"></th> -->
           
            <th pSortableColumn="Name" style="max-width: 0.5rem">
                Name
                <p-sortIcon field="Name" />
            </th>
            <!-- <th pSortableColumn="description" style="min-width: 0.5rem">
                Description
                 <p-sortIcon field="description" /> 
            </th> -->
          
                      
            <th pSortableColumn="dueDate" style="min-width: 1rem">
                Due Date
                <p-sortIcon field="dueDate" />
            </th>
            
            <!-- <th pSortableColumn="visibilityDate" style="min-width: 5rem">
                visibilityDate
                <p-sortIcon field="visibilityDate" />
            </th> -->
            <th pSortableColumn="CourseOffering" style="min-width: 1rem">
                Course
                <p-sortIcon field="CourseOffering" />
            </th>
            <th  style="min-width: 1rem">
                Submitted/Graded             
            </th>
            <th  style="min-width: 1rem">
                <!-- Edit Delete buttons-->                
            </th>
            
       
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-assignment>
        <tr>
            <!-- <td></td> -->
            <td>{{assignment.assignmentName}}  ({{assignment.description.substring(0,15)}})</td><!---->
            
            <td>{{formatLocalShortDate(assignment.dueDate)|   date:'dd/MM/yyyy'}}</td>
            <!-- <td>{{assignment.visibilityDate}}</td> -->
            <td>{{assignment.courseOffering.offeringName}}</td>
            <td></td>
            <td>
                <span *ngIf="authService.getUserId()==assignment.createdByUserId">.</span>
                  <p-button  icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"  (click)="editAssignment(assignment)" *ngIf="(assignment.canEdit$|async)"></p-button>
                <p-button  icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"  [disabled]="true"        *ngIf="!(assignment.canEdit$|async)"></p-button>
             
                <p-button  icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" *ngIf="(assignment.canDelete$|async)" (click)="deleteCourse(assignment)" />
                <p-button  icon="pi pi-trash" class="mr-2" [rounded]="true" [outlined]="true"     *ngIf="!(assignment.canDelete$|async)" [disabled]="true"></p-button>
           </td>
         
        </tr>
    </ng-template>
</p-table>
