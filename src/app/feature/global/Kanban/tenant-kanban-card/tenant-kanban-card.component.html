
<!-- Main Card Wrapper -->
<div class="p-4 mb-3"
     style="background-color: var(--surface-card, #ffffff); 
            border: 1px solid var(--surface-border, #e2e8f0); 
            border-left: 4px solid var(--primary-color, #3b82f6); 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            cursor: move;
            transition: all 0.2s ease-in-out;"
     onmouseover="this.style.boxShadow='0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)';"
     onmouseout="this.style.boxShadow='0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)';">
    
    <!-- Header: Tenant Name & Type Badge -->
    <div class="flex justify-content-between align-items-start mb-2 gap-2">
        <!-- Route array targeting parent tree branch view profile -->
        <a [routerLink]="['../tenantProfile', tenant.tenantId]" 
           class="no-underline hover:underline cursor-pointer"
           style="color: inherit;">
            <h5 class="m-0 text-900 font-semibold text-base line-height-3 text-overflow-ellipsis overflow-hidden">
                {{ tenant.tenantName }}
            </h5>
        </a>
        
        <!-- Tenant Type Lookup Tag Indicator -->
        <span class="font-medium mt-1 text-xs"
              style="background-color: var(--surface-b, rgba(148, 163, 184, 0.08)); 
                     color: var(--text-color-secondary, #64748b); 
                     padding: 3px 8px; 
                     border: 1px solid var(--surface-border, rgba(148, 163, 184, 0.15)); 
                     border-radius: 6px; 
                     display: inline-block;
                     white-space: nowrap;">
            {{ tenant.tenantTypeName || 'Standard' }}
        </span>
    </div>
