<!-- src/app/pages/role-permissions/role-permissions.component.html -->
<p-toast></p-toast>
<div class="customer-container p-4" style="display: block; width: 100%;">

  <!-- Filter matching role permissions layout mapping on roleName or permissionName -->
  <app-filter-control 
    [dataSource]="rolePermissions ? rolePermissions : []" 
    [filterFields]="['roleName', 'permissionName']" 
    (filteredData)="onDataFiltered($event)">
  </app-filter-control>

  <form [formGroup]="form" pFluid [class.hidden-form]="isFormHidden">
       
    <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>
        
    <div class="customer-actions" *ngIf="currOpMode !== 'VIEW'">
      <button
        pButton
        type="button"
        label="Assign Permission"
        icon="pi pi-check"
        (click)="saveRolePermission()"
        class="p-button-success"
        [disabled]="!form.valid">
      </button>
      <button
        pButton
        type="button"
        label="Clear Selection"
        icon="pi pi-refresh"
        (click)="clearRolePermission()"
        class="p-button-secondary"
        style="margin-left: 0.5rem">
      </button>
      <button
        pButton
        type="button"
        label="Cancel"
        icon="pi pi-times"
        (click)="CancelFormOp()"
        class="p-button-secondary"
        style="margin-left: 0.5rem"
        [disabled]="currOpMode !== 'ADD'">
      </button>
    </div>
  </form>
</div> 

<p-button *ngIf="currOpMode == 'VIEW'"
    label="Assign New Permission to Role" 
    icon="pi pi-plus" 
    (click)="Add()">
</p-button>

<div class="site-section mb-0" *ngIf="rolePermissions?.length">
  <h3 class="text-lg font-semibold mb-2">Assigned System Role Permissions Matrix</h3>
  <p-table [value]="visibleDataArray ? visibleDataArray : []" class="vendors-table">
    <ng-template pTemplate="header">
      <tr>
        <th>Role Name</th>
        <th>Assigned Permission Token</th>
        <th width="100px" class="text-center">Revoke</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-mapping let-rowIndex="rowIndex">
      <tr>
        <td><strong>{{ mapping.roleName }}</strong></td>
        <td><code class="text-primary font-bold">{{ mapping.permissionName }}</code></td>
        <td class="text-center">
          <button
            pButton
            type="button"
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-sm"
            (click)="removeRolePermission(mapping)">
          </button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
