
<!-- fields:{{fields|json}} 
 DCs:{{DCs|json}}
 currOpMode:{{currOpMode}}{{model|json}}-->
 <p-toast></p-toast>
 <p-toast></p-toast>
<div class="delivery-challan-container p-4">
  <p-toast></p-toast>

  <form [formGroup]="form" class="order-form" [class.hidden-form]="isFormHidden">
    <div class="order-header mb-4">
      <h2 class="text-xl font-bold mb-3">Delivery Challan</h2>
      
      <!-- Vendor Selection Display -->
      <div class="mb-4" *ngIf="model.vendor">
        <div class="selected-vendor p-3 bg-green-50 border border-green-200 rounded-lg">
          <div class="flex items-center justify-between">
            <div>
              <span class="text-sm text-gray-600">Selected Vendor:</span>
              <span class="ml-2 font-medium text-green-800"> model.vendor.vendorName </span>
            </div>
            <button 
              pButton 
              type="button" 
              icon="pi pi-times" 
              class="p-button-rounded p-button-danger p-button-sm"
              (click)="model.vendor = null; model.customerId = null; form.patchValue({ vendorId: null })">
            </button>
          </div>
        </div>
      </div>

      <formly-form [form]="form" [fields]="fields" [model]="model" ></formly-form>
    </div>
</form>
    


<p-button *ngIf="currOpMode=='VIEW'"
    label="New DC" 
    icon="pi pi-plus" 
    (click)="Add()" 
   
    >
</p-button>
    <div class="card" *ngIf="currOpMode=='VIEW'" >
  <p-table  [value]="DCs ?? []"   dataKey="id"   [expandedRowKeys]="expandedRows"   >
    
  <ng-template pTemplate="header">
      <tr>
        <th style="width: 5rem"></th> 
        <!-- <th>ID</th> -->
         <th></th>
        <th>DC Number</th>
        <th>Orderdate</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-dc let-expanded="expanded">
      <tr>
        <td>
           <p-button 
            type="button" 
            pRipple 
            [pRowToggler]="dc" 
            [text]="true" 
            [rounded]="true" 
            [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'">
          </p-button>         
        </td>
        <td>
           <p-button 
            type="button" 
            pRipple 
            [pRowToggler]="dc" 
            [text]="true" 
            [rounded]="true"   (click)="onEditClick(dc)"
            [icon]="'pi pi-pencil'">
          </p-button>         
        </td>
        <!-- <td> {{po.id}} </td> -->
        <td><strong>{{dc.dcNumber}}</strong> </td>
        <td>po.orderDate </td>
      </tr>
    </ng-template>
    
      <ng-template pTemplate="expandedrow" let-dc>
      <tr>
      <td colspan="4">
        <p-table *ngIf='dc && dc?.items && dc?.items.length' [value]="dc?.items" dataKey="id" class="p-datatable-sm">
          <ng-template pTemplate="header">
            <tr>
              
              <th>soid</th>
              <th>Quantity</th>
              <th>price</th>
              
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-item>
            <tr>
             
              <td>{{ item.salesOrderId }}</td>
              <td>{{ item.quantity }}</td>
              <td>{{ item.price }}</td>
              
            </tr>
          </ng-template>
        </p-table>
      </td>
    </tr>
    </ng-template>
    
  </p-table>
</div>
    
    <div class="order-actions">
      <p-button
        
       
        label="Save Delivery Challan"
        icon="pi pi-save"
        (click)="saveDeliveryChallan()"
        
        [disabled]="!form.valid">
      </p-button>
      <button
        pButton
        type="button"
        label="Clear Delivery Challan"
        icon="pi pi-times"
        (click)="clearDeliveryChallan()"
        class="p-button-secondary"
        style="margin-left: 0.5rem">
      </button>
      <button
        pButton
        type="button"
        label="Cancel"
        icon="pi pi-times"
        (click)="CancelFormOp()"
        class="p-button-secondary"
        style="margin-left: 0.5rem"
         [disabled]="currOpMode!=='ADD'&& currOpMode!=='UPDATE'">
      </button>
    </div>
  
</div>
