<td style="padding: 0.5rem;">
    <!-- NATIVE PRIMENG AUTOCOMPLETE -->
    <p-autoComplete 
        [(ngModel)]="selectedProduct" 
        [suggestions]="filteredProducts" 
        (completeMethod)="searchProducts($event)" 
        field="displayName" 
        placeholder="Type SKU or name (e.g., Mop, Cleaner)"
        [minLength]="2"
        [dropdown]="true"
        [style]="{'width':'100%'}"
        [inputStyle]="{'width':'100%', 'padding':'0.4rem', 'border':'1px solid #cbd5e1', 'border-radius':'4px', 'font-size':'0.85rem'}">
        
        <!-- Advanced Item Template to display both SKU and Price cleanly -->
        <ng-template let-product pTemplate="item">
            <div style="display: flex; justify-content: space-between; width: 100%; font-size: 0.85rem; font-family: sans-serif;">
                <div>
                    <span style="font-weight: 600; color: #1e293b;">{{product.sku}}</span>
                    <span style="color: #64748b; margin-left: 0.5rem;">{{product.name}}</span>
                </div>
                <div style="color: #2563eb; font-weight: 600;">
                    {{product.contractPrice | currency}}
                </div>
            </div>
        </ng-template>
    </p-autoComplete>
</td>
