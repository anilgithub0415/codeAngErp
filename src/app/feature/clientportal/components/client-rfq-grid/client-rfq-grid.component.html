<p>client-rfq-grid works!</p>
<div class="mb-3">
  <button 
    *ngxPermissionsOnly="['ClientRFQ.Create']"
    pButton
    type="button"
    label="New Request For Quotation" 
    icon="pi pi-plus" 
    (click)="addRequested.emit()">
  </button>
</div>

<div class="card mt-4">
  <p-table [value]="clientRFQs ?? []" dataKey="id" [expandedRowKeys]="expandedRows">
    
    <!-- 1. FIXED HEADER: Added an extra <th> for the Convert Action -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 5rem"></th> 
        <th style="width: 5rem"></th>
        <th>RFQ Number</th>
        <th>rfqDate</th>
        <th>Status</th>
        <th>Action</th> <!-- Added this column header -->
        <th style="width: 5rem"></th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-rfq let-expanded="expanded">
      <tr>
        <td>
          <button pButton type="button" pRipple [pRowToggler]="rfq" [text]="true" [rounded]="true" 
                  [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></button>         
        </td>
        <td>
          <button pButton type="button" pRipple [text]="true" [rounded]="true" (click)="editRequested.emit(rfq)"
                  [icon]="rfq.status === 'DRAFT' ? 'pi pi-pencil' : 'pi pi-eye'"></button>         
        </td>
        <td><strong>{{rfq.clientRFQNumber}}</strong></td>
        <td>{{rfq.rfqDate}}</td>
        <td>
          <span class="px-2 py-1 rounded text-sm font-medium"
            [ngClass]="{
              'bg-gray-100 text-gray-800': rfq.status === 'DRAFT',
              'bg-orange-100 text-orange-800': rfq.status === 'PENDING_APPROVAL',
              'bg-green-100 text-green-800': rfq.status === 'APPROVED'
            }">
            {{rfq.status}}
          </span>
        </td>
        
        
        <!-- 2. BODY COLUMN: Remains intact, now aligned correctly -->
        
       
    <td>
          <button  *ngxPermissionsOnly="['Quotation.Create']"
        type="button"
        (click)="onConvertClick(rfq)">
        Convert To Quotation
          </button>

</td>
        
        <td style="padding: 2px 4px !important;">
          <button pButton type="button" icon="pi pi-trash" 
                  class="p-button-rounded p-button-text p-button-danger p-button-sm p-0 m-0 w-2rem h-2rem flex align-items-center justify-content-center"
                  (click)="deleteRequested.emit(rfq); op.show($event)"
                  (mouseenter)="op.show($event)" 
                  (mouseleave)="op.hide()"></button>
             
          <p-overlayPanel #op [dismissable]="true" appendTo="body">
            <!-- Overlay Content remains unchanged -->
          </p-overlayPanel>
        </td>
      </tr>
    </ng-template>
    
    <!-- 3. FIXED EXPANDED ROW: Updated colspan from 6 to 8 -->
    <ng-template pTemplate="expandedrow" let-po>
      <tr>
        <td colspan="8"> <!-- Changed from 6 to 8 to match layout span -->
          <p-table *ngIf="po && po?.items && po?.items.length" [value]="po?.items" dataKey="id" class="p-datatable-sm">
            <!-- Sub-table content -->
          </p-table>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
